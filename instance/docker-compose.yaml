services:
  postgres:
    container_name: aditya-resume-postgres
    image: postgres:15-alpine
    env_file:
      - .env-backend
    environment:
      POSTGRES_USER: $DB_USER
      POSTGRES_PASSWORD: $DB_PASSWORD
      POSTGRES_DB: $DB_NAME
    volumes:
      - /mnt/data/postgres:/var/lib/postgresql/data
    networks:
      - app-network
    expose:
      - "5432"
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.2"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: aditya-resume-backend
    image: adityabijapurkar/aditya-resume-backend
    env_file:
      - .env-backend
    networks:
      - app-network
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    container_name: aditya-resume-frontend
    image: adityabijapurkar/aditya-resume-frontend
    networks:
      - app-network
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    container_name: aditya-resume-nginx
    image: adityabijapurkar/aditya-resume-nginx
    networks:
      - app-network
    volumes:
      - ./certs:/etc/ssl/cloudflare:ro
    ports:
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  app-network:
    driver: bridge